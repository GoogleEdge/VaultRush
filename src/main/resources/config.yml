world-protection:
  # 已启用竞技场的整个世界将作为专用比赛世界受到保护。
  enabled: true
  # 达到上限后会拒绝新的方块修改，避免出现无法回滚的改动。
  max-recorded-blocks: 50000
  message-cooldown-ticks: 20
settings:
  min-players: 2
  max-players: 8
  team-size: 4
  countdown-seconds: 10
  match-duration-seconds: 600
  score-to-win: 10
  gem-spawn-interval-seconds: 8
  max-vault-gems: 3
  death-gems: 1
  drop-carried-gems: true
  gem-material: EMERALD
  gem-name: '&a宝石'
  vault-radius: 3.0
  deposit-vertical-radius: 4.0
  respawn-delay-ticks: 20
  pickup-delay-ticks: 10
  menu:
    auto-open-on-join: true
  kit:
    sword: STONE_SWORD
    blocks: 32
    block-material: WHITE_WOOL
    food: 8
jobs:
  assault:
    passive:
      damage-multiplier: 1.10
    active:
      horizontal-power: 1.25
      vertical-power: 0.45
      cooldown-seconds: 24
  scout:
    passive:
      duration-seconds: 3
      cooldown-seconds: 10
    active:
      radius: 24.0
      duration-seconds: 5
      cooldown-seconds: 30
  guardian:
    passive:
      damage-multiplier: 0.85
    active:
      duration-seconds: 4
      cooldown-seconds: 30
  engineer:
    extra-blocks: 16
    active:
      duration-seconds: 8
      cooldown-seconds: 25
  illusionist:
    passive:
      duration-seconds: 2
      cooldown-seconds: 15
    active:
      duration-seconds: 5
      cooldown-seconds: 25
shop:
  enabled: true
  currency:
    kill-reward: 3
    deposit-reward-per-gem: 1
  items:
    speed:
      cost: 5
      duration-seconds: 10
      amplifier: 1
      cooldown-seconds: 20
      purchase-limit: 3
    jump:
      cost: 4
      duration-seconds: 10
      amplifier: 1
      cooldown-seconds: 20
      purchase-limit: 3
    fireball:
      cost: 8
      cooldown-seconds: 12
      purchase-limit: 3
      # 近似向上弹射 8 格；实际高度受服务器物理和周围方块影响。
      horizontal-power: 1.8
      vertical-power: 1.6
    shield:
      cost: 7
      duration-seconds: 8
      damage-reduction-percent: 30
      cooldown-seconds: 25
      purchase-limit: 2
    damage-boost:
      cost: 9
      duration-seconds: 8
      bonus-damage: 3.0
      cooldown-seconds: 25
      purchase-limit: 2
    smoke:
      cost: 6
      duration-seconds: 8
      amplifier: 1
      radius: 8.0
      cooldown-seconds: 20
      purchase-limit: 3
